name: testnet-10

# Exécute les commandes listées dans testnet/commande.txt sur le testnet-10 de Kaspa,
# puis enregistre le résultat dans testnet/journal.md (et l'état public du coffre).
on:
  push:
    branches: [main]
    paths: [testnet/commande.txt]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: testnet
  cancel-in-progress: false

jobs:
  run:
    # Seul le propriétaire du dépôt peut déclencher une exécution qui a accès au secret.
    # (Aucun déclencheur pull_request / pull_request_target : un fork ne voit jamais VAULT_PHRASE.)
    if: github.actor == 'Filou-974' && github.repository == 'Filou-974/kaspa-agent-vault'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cli/target
          key: cli-${{ hashFiles('cli/Cargo.toml', 'cli/Cargo.lock') }}
      - name: Compiler l'outil
        run: cd cli && cargo build --release
      - name: Exécuter les commandes
        env:
          VAULT_PHRASE: ${{ secrets.VAULT_PHRASE }}
        run: |
          {
            echo ""
            echo "## $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            echo '```'
            while IFS= read -r line || [ -n "$line" ]; do
              line="$(echo "$line" | sed 's/#.*//' | xargs)"
              [ -z "$line" ] && continue
              cmd="${line%% *}"
              case "$cmd" in
                adresses|etat|deployer|payer|recharger|recuperer|demo-x402|pause|masse) ;;
                *) echo "commande refusée (hors liste blanche) : $cmd"; continue ;;
              esac
              echo "\$ vault-cli $line"
              ./cli/target/release/vault-cli $line 2>&1 || echo "(code de sortie $?)"
              echo ""
            done < testnet/commande.txt
            echo '```'
          } | tee -a testnet/journal.md
      - name: Enregistrer le journal
        run: |
          git config user.name "vault-bot"
          git config user.email "vault-bot@users.noreply.github.com"
          git add testnet/journal.md testnet/etat-coffre.json 2>/dev/null || git add testnet/journal.md
          git commit -m "Journal testnet [skip ci]" || echo "rien à enregistrer"
          git push
